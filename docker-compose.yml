version: '3'
services:
  e-commerce-db:
    image: erpmicroservices/e-commerce-db:latest
    ports:
      - "5432:5432"

  party-db:
    image: erpmicroservices/party-db:2.1.0
    ports:
      - "5433:5432"

  admin_api:
    image: thejimbarrows/walker_knocker_admin_api
    build: .
    links:
      - e-commerce-db
      - party-db
    volumes:
      - "./:/usr/src/app"
    labels:
      - "traefik.backend=walker_knocker_admin_api"
      - "traefik.frontend.rule=PathPrefixStrip:/api/walker_knocker/admin"
      - "traefik.port=80"
      - "traefik.frontend.entryPoints=http"

  db_admin:
    image: thajeztah/pgadmin4
    ports:
      - "5050:5050"
    links:
      - e-commerce-db
      - party-db
    labels:
      - "traefik.backend=walker_knocker_db_admin"
      - "traefik.frontend.rule=PathPrefixStrip:/db_admin"
      - "traefik.port=80"
      - "traefik.frontend.entryPoints=http"

  traefik:
    image: traefik
    container_name: e-commerce-admin-services-traefik
    command: --web --docker --docker.domain=docker.localhost --logLevel=DEBUG
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/null:/traefik.toml
